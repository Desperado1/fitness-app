name: Build IPA

# Manual only: build an unsigned .ipa for sideloading (AltStore signs it
# on install). Run from the Actions tab when you want a new build on the
# phone — keeps free macOS minutes for the test workflow.
on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA for sideloading
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AdaptFit.xcodeproj \
            -scheme AdaptFit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath AdaptFit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee archive.log | grep -E 'error:|warning: -|ARCHIVE' || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R "AdaptFit.xcarchive/Products/Applications/AdaptFit.app" Payload/
          zip -qry AdaptFit.ipa Payload
          ls -la AdaptFit.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdaptFit-ipa
          path: AdaptFit.ipa
          retention-days: 90

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
          if-no-files-found: ignore
          retention-days: 7
