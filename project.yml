name: AdaptFit
options:
  bundleIdPrefix: com.adaptfit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AdaptFit:
    type: application
    platform: iOS
    sources:
      - AdaptFit
    info:
      path: AdaptFit/Info.plist
      properties:
        CFBundleDisplayName: AdaptFit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptfit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AdaptFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AdaptFitTests
    dependencies:
      - target: AdaptFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptfit.tests
        GENERATE_INFOPLIST_FILE: YES
  AdaptFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AdaptFitUITests
    dependencies:
      - target: AdaptFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptfit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AdaptFit
schemes:
  AdaptFit:
    build:
      targets:
        AdaptFit: all
    run:
      config: Debug
    test:
      targets:
        - AdaptFitTests
        - AdaptFitUITests
