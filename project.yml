name: FlowFit
options:
  bundleIdPrefix: com.flowfit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FlowFit:
    type: application
    platform: iOS
    sources:
      - FlowFit
    info:
      path: FlowFit/Info.plist
      properties:
        CFBundleDisplayName: FlowFit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowfit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FlowFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlowFitTests
    dependencies:
      - target: FlowFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowfit.tests
        GENERATE_INFOPLIST_FILE: YES
  FlowFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FlowFitUITests
    dependencies:
      - target: FlowFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowfit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlowFit
schemes:
  FlowFit:
    build:
      targets:
        FlowFit: all
    run:
      config: Debug
    test:
      targets:
        - FlowFitTests
        - FlowFitUITests
