name: FlowFit
options:
  bundleIdPrefix: com.flowfit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Must stay above 1.0. One build escaped before the version keys were wired
    # up (see the CFBundleVersion note below) and shipped as XcodeGen's default
    # 1.0 (1). Anything at 0.x reads as older than that build, so TestFlight
    # offers no update to phones carrying it.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FlowFit:
    type: application
    platform: iOS
    sources:
      - FlowFit
    info:
      path: FlowFit/Info.plist
      properties:
        CFBundleDisplayName: FlowFit
        # Reference the build settings so fastlane's per-run CURRENT_PROJECT_VERSION
        # override (github.run_number) actually reaches CFBundleVersion. Without
        # these, XcodeGen emits its literal default of "1" and every TestFlight
        # upload is rejected as a duplicate build number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowwfit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Apple Developer team that owns the distribution cert + profile
        # (managed by fastlane match). Needed so xcodebuild can sign the app.
        DEVELOPMENT_TEAM: "4KBT68AAF6"
      configs:
        # Release archives (TestFlight) sign manually with the match-managed
        # App Store profile. Debug/simulator test builds set
        # CODE_SIGNING_ALLOWED=NO in CI, so they ignore these.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.flowwfit.app"
  FlowFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlowFitTests
    dependencies:
      - target: FlowFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowfit.tests
        GENERATE_INFOPLIST_FILE: YES
  FlowFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FlowFitUITests
    dependencies:
      - target: FlowFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowfit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlowFit
schemes:
  FlowFit:
    build:
      targets:
        FlowFit: all
    run:
      config: Debug
    test:
      targets:
        - FlowFitTests
        - FlowFitUITests
